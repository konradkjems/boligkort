name: Byg matrikel-tileset

# Natlig opdatering af Mapbox-tilesettet med jordstykker, byggeår,
# anvendelse og værdi pr. m² for pilotområdet.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  tileset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATAFORDELER_CLIENT_ID: ${{ secrets.DATAFORDELER_CLIENT_ID }}
      DATAFORDELER_CLIENT_SECRET: ${{ secrets.DATAFORDELER_CLIENT_SECRET }}
      DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
      MAPBOX_SECRET_TOKEN: ${{ secrets.MAPBOX_SECRET_TOKEN }}
      MAPBOX_USERNAME: ${{ vars.MAPBOX_USERNAME }}
      MAPBOX_TILESET: ${{ vars.MAPBOX_TILESET }}
      PILOT_BBOX: ${{ vars.PILOT_BBOX }}
    steps:
      - name: Tjek konfiguration
        id: cfg
        run: |
          if [ -z "$MAPBOX_SECRET_TOKEN" ] || [ -z "$MAPBOX_USERNAME" ] || { [ -z "$DATAFORDELER_API_KEY" ] && [ -z "$DATAFORDELER_CLIENT_SECRET" ]; }; then
            echo "::notice::Springer over: MAPBOX_SECRET_TOKEN, MAPBOX_USERNAME og Datafordeler-credentials skal være sat."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.skip != 'true'
      - run: npm run tileset
        if: steps.cfg.outputs.skip != 'true'
